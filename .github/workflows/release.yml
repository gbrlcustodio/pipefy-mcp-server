name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Verify tag matches package version
        run: |
          python <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          path = Path("packages/sdk/src/pipefy_sdk/__init__.py")
          m = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              path.read_text(encoding="utf-8"),
              re.M,
          )
          if not m or m.group(1) != expected:
              got = m.group(1) if m else "MISSING"
              print(f"Tag {tag!r} does not match SDK __version__ {got!r}", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Build release notes body for this tag
        run: |
          python <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n.*?(?=^## |\Z)"
          m = re.search(pat, text)
          if not m:
              print(
                  f"No CHANGELOG section found for version {ver!r} "
                  f"(expected a heading like ## [{ver}] ...).",
                  file=sys.stderr,
              )
              sys.exit(1)
          Path("CHANGELOG_RELEASE_BODY.md").write_text(
              m.group(0).rstrip() + "\n",
              encoding="utf-8",
          )
          PY
      - name: Build wheels and sdist (all workspace packages)
        run: uv build --all-packages -o dist --wheel --sdist
      - name: Verify expected wheels in dist/
        run: |
          python <<'PY'
          import sys
          from pathlib import Path

          dist = Path("dist")
          for prefix in ("pipefy_sdk", "pipefy_mcp_server", "pipefy_cli", "pipefy_auth", "pipefy_infra"):
              wheels = list(dist.glob(f"{prefix}-*.whl"))
              if len(wheels) != 1:
                  print(
                      f"expected exactly one wheel matching {prefix}-*.whl, got {wheels!r}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body_path: CHANGELOG_RELEASE_BODY.md
      - name: Patch plugin manifests on main to new tag's wheel URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.removeprefix("v")
          # Tag-to-wheel-version normalization. Covers the prerelease forms used in RELEASE.md
          # (`-beta.N`, `-rc.N`, `-alpha.N`); extend here if the release flow adopts others.
          pep = ver.replace("-beta.", "b").replace("-rc.", "rc").replace("-alpha.", "a")
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          url_pattern = re.compile(
              r"https://github\.com/[\w./-]+/releases/download/v[\w.+\-]+/(pipefy_\w+)-[\w.+]+-py3-none-any\.whl"
          )

          def rewrite(match: re.Match[str]) -> str:
              pkg = match.group(1)
              return f"{base}/{pkg}-{pep}-py3-none-any.whl"

          for path in ("commands/install.md", ".mcp.json"):
              p = Path(path)
              p.write_text(url_pattern.sub(rewrite, p.read_text(encoding="utf-8")), encoding="utf-8")

          for path, key_path in [
              (".claude-plugin/plugin.json", ("version",)),
              (".claude-plugin/marketplace.json", ("plugins", 0, "version")),
          ]:
              p = Path(path)
              data = json.loads(p.read_text(encoding="utf-8"))
              obj = data
              for k in key_path[:-1]:
                  obj = obj[k]
              obj[key_path[-1]] = ver
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          git add .mcp.json commands/install.md .claude-plugin/plugin.json .claude-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): point plugin manifests at ${GITHUB_REF_NAME} wheels"
            git push origin main
          else
            echo "No manifest changes to commit"
          fi
          # Restore the working tree to the tag SHA so any subsequent step that reads tracked
          # files sees the release commit, not main's tip.
          git checkout "${GITHUB_SHA}"
      - name: Stage PyPI wheels (SDK + CLI + MCP + Auth + Infra)
        if: startsWith(github.ref_name, 'v1.') && !contains(github.ref_name, '-')
        run: |
          mkdir -p dist-pypi
          shopt -s nullglob
          sdk=(dist/pipefy_sdk-*.whl)
          cli=(dist/pipefy_cli-*.whl)
          mcp=(dist/pipefy_mcp_server-*.whl)
          auth=(dist/pipefy_auth-*.whl)
          infra=(dist/pipefy_infra-*.whl)
          if [ "${#sdk[@]}" -ne 1 ] || [ "${#cli[@]}" -ne 1 ] || [ "${#mcp[@]}" -ne 1 ] || [ "${#auth[@]}" -ne 1 ] || [ "${#infra[@]}" -ne 1 ]; then
            echo "Expected one SDK, one CLI, one MCP, one Auth, and one Infra wheel in dist/"
            echo "sdk=${#sdk[@]} cli=${#cli[@]} mcp=${#mcp[@]} auth=${#auth[@]} infra=${#infra[@]}"
            ls -la dist || true
            exit 1
          fi
          cp "${sdk[0]}" "${cli[0]}" "${mcp[0]}" "${auth[0]}" "${infra[0]}" dist-pypi/
      - name: Smoke install staged wheels (clean venv)
        if: startsWith(github.ref_name, 'v1.') && !contains(github.ref_name, '-')
        run: |
          python -m venv .venv-pypi-smoke
          .venv-pypi-smoke/bin/python -m pip install --upgrade pip
          .venv-pypi-smoke/bin/pip install dist-pypi/*.whl
          .venv-pypi-smoke/bin/pipefy --help
          .venv-pypi-smoke/bin/pipefy-mcp-server --help
      - name: Upload to PyPI
        if: startsWith(github.ref_name, 'v1.') && !contains(github.ref_name, '-')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
