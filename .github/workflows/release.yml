name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Verify tag matches package version
        run: |
          python <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          path = Path("packages/sdk/src/pipefy_sdk/__init__.py")
          m = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              path.read_text(encoding="utf-8"),
              re.M,
          )
          if not m or m.group(1) != expected:
              got = m.group(1) if m else "MISSING"
              print(f"Tag {tag!r} does not match SDK __version__ {got!r}", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Build release notes body for this tag
        run: |
          python <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n.*?(?=^## |\Z)"
          m = re.search(pat, text)
          if not m:
              print(
                  f"No CHANGELOG section found for version {ver!r} "
                  f"(expected a heading like ## [{ver}] ...).",
                  file=sys.stderr,
              )
              sys.exit(1)
          Path("CHANGELOG_RELEASE_BODY.md").write_text(
              m.group(0).rstrip() + "\n",
              encoding="utf-8",
          )
          PY
      - name: Build wheels and sdist (all workspace packages)
        run: uv build --all-packages -o dist --wheel --sdist
      - name: Verify expected wheels in dist/
        run: |
          python <<'PY'
          import sys
          from pathlib import Path

          dist = Path("dist")
          expected = ("pipefy_sdk", "pipefy_mcp_server", "pipefy_cli", "pipefy_auth", "pipefy_infra")
          for prefix in expected:
              wheels = list(dist.glob(f"{prefix}-*.whl"))
              if len(wheels) != 1:
                  print(
                      f"expected exactly one wheel matching {prefix}-*.whl, got {wheels!r}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          # Bound the published set: any wheel beyond the five known packages
          # (e.g. a new workspace member) must fail here rather than be silently
          # published, since the publish step copies every wheel in dist/.
          all_wheels = list(dist.glob("*.whl"))
          if len(all_wheels) != len(expected):
              print(
                  f"expected exactly {len(expected)} wheels in dist/, got "
                  f"{sorted(w.name for w in all_wheels)!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body_path: CHANGELOG_RELEASE_BODY.md
      - name: Upload built distributions
        if: vars.PYPI_PUBLISH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-pypi:
    needs: release
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Stage wheels for PyPI (exclude sdists)
        # The release job already verified exactly one wheel per package and no
        # extras before uploading the artifact, so publish the wheels and skip
        # the sdists.
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "no wheels in dist/ to publish" >&2
            exit 1
          fi
          mkdir -p dist-pypi
          cp "${wheels[@]}" dist-pypi/
      - name: Smoke install staged wheels (clean venv)
        run: |
          python -m venv .venv-pypi-smoke
          .venv-pypi-smoke/bin/python -m pip install --upgrade pip
          .venv-pypi-smoke/bin/pip install dist-pypi/*.whl
          .venv-pypi-smoke/bin/pipefy --help
          .venv-pypi-smoke/bin/pipefy-mcp-server --help
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
          # Idempotent re-runs: a re-pushed tag at an already-published version
          # skips existing files instead of failing the release on PyPI's 400.
          skip-existing: true
