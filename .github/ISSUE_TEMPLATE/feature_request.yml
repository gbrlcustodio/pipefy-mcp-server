name: Feature request
description: Suggest an enhancement to the MCP server, CLI, SDK, or skills.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which surface should this land on?
      options:
        - MCP server
        - CLI
        - SDK
        - Skills
        - Docs / other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include tool/command names if you have them in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you already tried.
    validations:
      required: false
  - type: checkboxes
    id: parity
    attributes:
      label: Parity
      options:
        - label: I checked docs/parity.md (or am okay deferring CLI/MCP parity explicitly)
          required: false
