name: Skills Lint

on:
  push:
    paths:
      - "skills/**"
      - "packages/mcp/src/pipefy_mcp/tools/registry.py"
      - ".github/workflows/skills-lint.yml"
      - ".github/workflows/scripts/**"
  pull_request:
    paths:
      - "skills/**"
      - "packages/mcp/src/pipefy_mcp/tools/registry.py"
      - ".github/workflows/skills-lint.yml"
      - ".github/workflows/scripts/**"

jobs:
  validate-skills:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'EOF'
          import os
          import sys

          errors = []

          for root, dirs, files in os.walk("skills"):
              # Skip copyable starters under skills/_template/
              dirs[:] = [d for d in dirs if d != "_template"]
              if "_template" in root.split(os.sep):
                  continue
              # Skip docs/ and top-level files
              if "SKILL.md" not in files:
                  continue
              skill_path = os.path.join(root, "SKILL.md")
              skill_dir = os.path.basename(root)

              with open(skill_path, encoding="utf-8") as f:
                  content = f.read()

              if not content.startswith("---"):
                  errors.append(f"{skill_path}: missing YAML frontmatter (must start with ---)")
                  continue

              # Extract frontmatter block
              parts = content.split("---", 2)
              if len(parts) < 3:
                  errors.append(f"{skill_path}: malformed frontmatter (no closing ---)")
                  continue

              frontmatter = parts[1]

              # Check required fields
              if "name:" not in frontmatter:
                  errors.append(f"{skill_path}: missing required frontmatter field 'name'")
              if "description:" not in frontmatter:
                  errors.append(f"{skill_path}: missing required frontmatter field 'description'")

              # Extract name value and validate it matches directory
              for line in frontmatter.splitlines():
                  if line.startswith("name:"):
                      name_value = line.split(":", 1)[1].strip()
                      if name_value and name_value != skill_dir:
                          errors.append(
                              f"{skill_path}: 'name' field ({name_value!r}) does not match directory name ({skill_dir!r})"
                          )
                      break

          if errors:
              print("Skills validation FAILED:")
              for e in errors:
                  print(f"  ✗ {e}")
              sys.exit(1)
          else:
              count = 0
              for root, dirs, files in os.walk("skills"):
                  dirs[:] = [d for d in dirs if d != "_template"]
                  if "_template" in root.split(os.sep):
                      continue
                  if "SKILL.md" in files:
                      count += 1
              print(f"Skills validation passed — {count} skill(s) validated.")
          EOF

      - name: Validate MCP and CLI references in skills
        run: |
          uv sync --quiet
          uv run python .github/workflows/scripts/lint_skill_refs.py
