name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Get changed Python files
      id: changed-files
      uses: tj-actions/changed-files@v47
      with:
        files: |
          **/*.py
          *.py
    - name: Lint with ruff on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: uv run ruff check ${{ steps.changed-files.outputs.changed_files }}
    - name: Check formatting with ruff on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: uv run ruff format --check ${{ steps.changed-files.outputs.changed_files }}

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    # Both, because they disagree: /bin/sh is dash on Debian-family images and
    # rejects constructs bash in POSIX mode forgives, which is what a
    # contributor on macOS is checking against.
    - name: POSIX syntax
      run: |
        for script in install.sh uninstall.sh; do
          sh -n "$script"
          dash -n "$script"
        done
    # The same release the pre-commit hook pins, from the same package, so the
    # hook and the build cannot disagree about what passes.
    - name: ShellCheck
      run: uvx --from shellcheck-py==0.11.0.1 shellcheck --shell=sh install.sh uninstall.sh
    - name: Deletions route through remove_path
      run: python3 .github/workflows/scripts/check_deletion_guard.py
    # Not a behavioural test: whether the producer is still writing when the
    # consumer leaves depends on the pipe buffer, so an early exit reproduces
    # on one platform and not another.
    - name: Consumers of a streaming producer read to the end
      run: python3 .github/workflows/scripts/check_pipe_drain.py

  # The only check that proves completeness rather than the correctness of a
  # step someone thought to write: install for real, tear down for real, and
  # compare the filesystem with what was there before.
  roundtrip:
    name: install.sh then uninstall.sh
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
    # `npx skills add` writes into the working directory, not $HOME, whatever
    # agent directories exist elsewhere. Both scripts therefore run from a
    # scratch directory under $HOME: the skills land somewhere the snapshot
    # covers, so a teardown that stopped removing them would fail this job.
    # RUNNER_TEMP is under $HOME on hosted runners and is pruned as runner
    # noise, which is why it is not that directory.
    - name: Make the scratch directory both scripts run from
      run: mkdir -p "$HOME/roundtrip" "$HOME/.claude"
    - name: Snapshot HOME
      run: python3 .github/workflows/scripts/check_roundtrip.py snapshot "$RUNNER_TEMP/before.txt"
    # Not the checkout: this repository's own git-tracked .mcp.json is a
    # project-scope registration, and tearing down against one is a different
    # scenario from a user's machine.
    - name: Install
      run: |
        cd "$HOME/roundtrip"
        sh "$GITHUB_WORKSPACE/install.sh" --yes --client cursor
    - name: Snapshot HOME after the install
      run: python3 .github/workflows/scripts/check_roundtrip.py snapshot "$RUNNER_TEMP/installed.txt"
    - name: The install is real
      run: |
        "$HOME/.local/bin/pipefy" --version
        uv tool list | grep -q pipefy-cli
        python3 -c "
        import json, pathlib
        config = json.loads(pathlib.Path.home().joinpath('.cursor/mcp.json').read_text())
        assert config['mcpServers']['pipefy'] == {'command': 'pipefy-mcp-server'}, config
        "
        # Pins where the skills actually landed. If a future `skills add`
        # chooses somewhere else, this fails here rather than quietly leaving
        # the teardown assertion below with nothing to prove.
        ls "$HOME/roundtrip/.claude/skills" | grep -q '^pipefy-'
    # ubuntu-latest often has a session bus address but no Secret Service client.
    # uninstall.sh then treats the keychain as uninspected and exits 2 even after
    # a clean teardown. An empty probe matches the test stubs: no pipefy items.
    # Keep the stub outside $HOME so check_roundtrip does not see it as drift.
    - name: Stub an empty Secret Service probe
      run: |
        mkdir -p /tmp/pipefy-ci-bin
        printf '%s\n' '#!/bin/sh' 'exit 0' > /tmp/pipefy-ci-bin/secret-tool
        chmod +x /tmp/pipefy-ci-bin/secret-tool
        echo /tmp/pipefy-ci-bin >> "$GITHUB_PATH"
    - name: Uninstall
      run: |
        cd "$HOME/roundtrip"
        sh "$GITHUB_WORKSPACE/uninstall.sh" --yes
    - name: Snapshot HOME after the teardown
      run: python3 .github/workflows/scripts/check_roundtrip.py snapshot "$RUNNER_TEMP/after.txt"
    - name: Nothing the toolkit installed is still registered
      run: |
        if uv tool list | grep pipefy; then
          echo "a uv tool survived the teardown" >&2
          exit 1
        fi
        python3 -c "
        import json, pathlib
        config = json.loads(pathlib.Path.home().joinpath('.cursor/mcp.json').read_text())
        assert 'pipefy' not in config.get('mcpServers', {}), config
        "
        # Stated outright rather than left to the filesystem diff, so the
        # guarantee does not depend on which directories stay pruned.
        left=$(find "$HOME" -maxdepth 6 -path '*/.claude/skills/pipefy-*' -print 2>/dev/null | head -5)
        if [ -n "$left" ]; then
          echo "skills survived the teardown:" >&2
          printf '%s\n' "$left" >&2
          exit 1
        fi
    - name: The filesystem is back where it started
      run: |
        python3 .github/workflows/scripts/check_roundtrip.py check \
          "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/installed.txt" "$RUNNER_TEMP/after.txt"

  test:
    runs-on: ubuntu-latest
    env:
      # Valid https:// URLs (required by Settings URL validation; values are dummies for unit tests)
      PIPEFY_GRAPHQL_URL: 'https://app.pipefy.com/graphql'
      PIPEFY_INTERNAL_API_URL: 'https://app.pipefy.com/internal_api'
      PIPEFY_OAUTH_URL: 'https://app.pipefy.com/oauth/token'
      PIPEFY_OAUTH_CLIENT: 'CI_DUMMY_CLIENT'
      PIPEFY_OAUTH_SECRET: 'CI_DUMMY_SECRET'
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Verify package versions are in lockstep
      run: uv run python scripts/bump_version.py verify
    - name: Lint (full tree)
      run: uv run ruff check packages/sdk/src packages/mcp/src packages/cli/src packages/auth/src packages/infra/src
    - name: Check formatting
      run: uv run ruff format --check packages/sdk/src packages/mcp/src packages/cli/src packages/auth/src packages/infra/src
    - name: Lint SDK (banned upward imports)
      run: cd packages/sdk && uv run ruff check src
    - name: Lint auth (banned upward imports)
      run: cd packages/auth && uv run ruff check src
    - name: Lint infra (banned upward imports)
      run: cd packages/infra && uv run ruff check src
    - name: Lint mcp (intra-package layers)
      run: cd packages/mcp && uv run lint-imports
    - name: Build workspace wheels (packaging smoke)
      run: uv build --all-packages --wheel -o dist-packaging-smoke
    # Resolves dependencies from PyPI rather than uv.lock, which is the only way
    # to see an upstream release the lock pins us away from. This covers pushes
    # and pull requests; packaging-smoke.yml runs the same check on a timer, for
    # the window between them where no commit triggers anything at all.
    - name: Smoke install workspace wheels (clean venv)
      run: |
        # Membership is checked before the install, not after: an incomplete set
        # is not an error for pip, which satisfies the absent member from the
        # index through the sibling `==` pins. The smoke would then pass against
        # a wheel this build never produced.
        python scripts/smoke_entry_points.py --check-wheels dist-packaging-smoke
        python -m venv .venv-cli-smoke
        .venv-cli-smoke/bin/pip install dist-packaging-smoke/*.whl
        .venv-cli-smoke/bin/python scripts/smoke_entry_points.py
    - name: Run tests
      run: uv run pytest -m "not integration"
