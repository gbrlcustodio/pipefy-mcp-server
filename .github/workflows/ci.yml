name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Get changed Python files
      id: changed-files
      uses: tj-actions/changed-files@v47
      with:
        files: |
          **/*.py
          *.py
    - name: Lint with ruff on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: uv run ruff check ${{ steps.changed-files.outputs.changed_files }}
    - name: Check formatting with ruff on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: uv run ruff format --check ${{ steps.changed-files.outputs.changed_files }}

  test:
    runs-on: ubuntu-latest
    env:
      # Valid https:// URLs (required by Settings URL validation; values are dummies for unit tests)
      PIPEFY_GRAPHQL_URL: 'https://app.pipefy.com/graphql'
      PIPEFY_INTERNAL_API_URL: 'https://app.pipefy.com/internal_api'
      PIPEFY_OAUTH_URL: 'https://app.pipefy.com/oauth/token'
      PIPEFY_OAUTH_CLIENT: 'CI_DUMMY_CLIENT'
      PIPEFY_OAUTH_SECRET: 'CI_DUMMY_SECRET'
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Verify package versions are in lockstep
      run: |
        uv run python <<'PY'
        import re
        from pathlib import Path

        paths = {
            "sdk": Path("packages/sdk/src/pipefy_sdk/__init__.py"),
            "mcp": Path("packages/mcp/src/pipefy_mcp/__init__.py"),
            "cli": Path("packages/cli/src/pipefy_cli/__init__.py"),
            "auth": Path("packages/auth/src/pipefy_auth/__init__.py"),
        }
        rx = re.compile(r'^__version__\s*=\s*["\']([^"\']+)["\']', re.M)
        found = {}
        for name, path in paths.items():
            text = path.read_text(encoding="utf-8")
            m = rx.search(text)
            if not m:
                raise SystemExit(f"missing __version__ in {path}")
            found[name] = m.group(1)
        versions = list(found.values())
        if len(set(versions)) != 1:
            raise SystemExit(f"version mismatch across packages: {found}")
        PY
    - name: Lint (full tree)
      run: uv run ruff check packages/sdk/src packages/mcp/src packages/cli/src
    - name: Check formatting
      run: uv run ruff format --check packages/sdk/src packages/mcp/src packages/cli/src
    - name: Lint SDK (banned upward imports)
      run: cd packages/sdk && uv run ruff check src
    - name: Build MCP wheel (packaging smoke)
      run: uv build packages/mcp -o packages/mcp/dist
    - name: Run tests
      run: uv run pytest -m "not integration"
